# Deliberately conservative: real errors and likely bugs only (pyflakes,
# pycodestyle errors, bugbear). Widen one rule family at a time, fixing the
# code in the same change. Run: `ruff check .` from this directory.
target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F", "B"]
# FastAPI declares request parameters as call defaults (`Body(...)`,
# `Depends(...)`); that is the framework's idiom, not the bug B008 targets.
ignore = ["B008"]

[lint.per-file-ignores]
# Tests may import after fixtures or path setup.
"tests/**" = ["E402"]
